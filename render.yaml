# Render blueprint: New > Blueprint > pick this repo.
# pnpm runs through npx (no corepack, which needs root on Render).
# After the first deploy, set PHONE_APP_URL to wherever the phone app is hosted,
# and VITE_SERVER_URL / VITE_KIOSK_KEY on the kiosk, then redeploy the kiosk.
services:
  - type: web
    name: kiosk-access-server
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile
    startCommand: cd apps/server && node --import tsx src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: KIOSK_KEY
        generateValue: true
      - key: PHONE_APP_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      # The AI agent. Without AGENT_MODE=gemini the server runs the stub agent.
      - key: AGENT_MODE
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3-flash-preview
      - key: DEV_ROUTES
        value: "1"

  - type: web
    name: kiosk-access-phone
    runtime: static
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 --filter @kiosk-access/phone build
    staticPublishPath: apps/phone/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_SERVER_URL
        sync: false

  - type: web
    name: kiosk-access-kiosk
    runtime: static
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 --filter @kiosk-access/kiosk build
    staticPublishPath: apps/kiosk/dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_SERVER_URL
        sync: false
      - key: VITE_KIOSK_ID
        value: store42-kiosk1
      - key: VITE_KIOSK_KEY
        sync: false
